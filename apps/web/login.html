<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        background: #0f1117;
        color: #e2e8f0;
      }
      .left {
        flex: 1;
        background: linear-gradient(145deg, #0f172a, #1e3a8a);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 48px;
        text-align: center;
      }
      .left .icon { font-size: 64px; margin-bottom: 20px; }
      .left h1 { font-size: 32px; margin-bottom: 12px; }
      .left p { color: #93c5fd; line-height: 1.7; max-width: 300px; }
      .right {
        width: 100%;
        max-width: 480px;
        background: #1a1f2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 48px 40px;
      }
      .tabs {
        display: flex;
        gap: 0;
        background: rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 28px;
      }
      .tabs button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 9px;
        background: transparent;
        color: #64748b;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tabs button.active { background: #3b82f6; color: #fff; }
      h2 { font-size: 22px; margin-bottom: 6px; }
      .sub { color: #64748b; font-size: 14px; margin-bottom: 24px; }
      label {
        display: block;
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        color: #e2e8f0;
        font-size: 15px;
        margin-bottom: 16px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus { border-color: #3b82f6; }
      .forgot { text-align: right; margin-top: -10px; margin-bottom: 16px; }
      .forgot a { font-size: 13px; color: #60a5fa; text-decoration: none; }
      .btn-submit {
        width: 100%;
        padding: 14px;
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-submit:hover { background: #2563eb; }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
        color: #475569;
        font-size: 13px;
      }
      .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-top: 1px solid rgba(255,255,255,0.08);
      }
      .social { display: flex; gap: 10px; }
      .social button {
        flex: 1;
        padding: 11px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        color: #e2e8f0;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      @media (max-width: 700px) {
        body { flex-direction: column; }
        .left { padding: 32px; min-height: 200px; }
        .right { max-width: 100%; padding: 32px 24px; }
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="icon">&#128274;</div>
      <h1>Welcome back</h1>
      <p>Sign in to access your dashboard, projects, and team workspace.</p>
    </div>
    <div class="right">
      <div class="tabs">
        <button class="active">Sign in</button>
        <button>Create account</button>
      </div>
      <h2>Sign in to your account</h2>
      <p class="sub">Don't have an account? Click Create account above.</p>
      <label>Email</label>
      <input type="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" placeholder="Your password" />
      <div class="forgot">
        <a href="#">Forgot password?</a>
      </div>
      <button class="btn-submit">Sign in</button>
      <div class="divider">or continue with</div>
      <div class="social">
        <button>&#128247; Google</button>
        <button>&#128008; GitHub</button>
      </div>
    </div>
  </body>
</html>
